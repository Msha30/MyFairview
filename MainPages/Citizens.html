<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyFairview</title>
    <link rel="stylesheet" href="../CSS/Components.css">
    <link rel="stylesheet" href="../CSS/Citizens.css">
    <script type="module" src="../JS/subpage_guard.js"></script>
    <script type="module" src="../JS/Popup_Citizens.js"></script>
</head>

<body>
    <div class="cardtable">
        <!-- ════════════════════════════════════════════════ -->
        <!-- ════════════════════ HEADER ════════════════════ -->
        <!-- ════════════════════════════════════════════════ -->
        <div class="header">
            <div class="title">
                <div class="tabletitle">Citizen Registry</div>
                <div class="tablesubtitle">Resident Information and Verification Status</div>
            </div>
            <a class="btn export" href="#">Export CSV</a>
        </div>

        <!-- ════════════════════════════════════════════════ -->
        <!-- ═══════════════════ SEARCH ROW ═════════════════ -->
        <!-- ════════════════════════════════════════════════ -->
        <div class="search-row">
            <div class="inline-search">
                <img src="../Icons/ic_search.svg">
                <input id="search" type="text" placeholder="Search...">
            </div>
            <div class="form-selectbg">
                <select id="areaFilter" class="form-select" style="width:150px;">
                    <option value="all">All Subdivision</option>
                    <option value="subdivision 1">Subdivision 1</option>
                    <option value="subdivision 2">Subdivision 2</option>
                    <option value="subdivision 3">Subdivision 3</option>
                    <option value="no subdivision">No Subdivision</option>
                    <option value="condominium">Condominium</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="form-selectbg">
                <select id="statusFilter" class="form-select" style="width:100px;">
                    <option value="all">All Users</option>
                    <option value="verified">Verified</option>
                    <option value="unverified">Unverified</option>
                    <option value="invalid">Invalid</option>
                </select>
            </div>
        </div>

        <!-- ════════════════════════════════════════════════ -->
        <!-- ════════════════════ TABLE ═════════════════════ -->
        <!-- ════════════════════════════════════════════════ -->
        <div class="table-scroll-wrapper">
            <table class="tableDiv citizens">
                <thead>
                    <tr>
                        <th>RESIDENT</th>
                        <th>AREA</th>
                        <th>SEX</th>
                        <th>DATE OF BIRTH</th>
                        <th>CONTACT NUMBER</th>
                        <th>STATUS</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Rows -->
                </tbody>
            </table>
        </div>
    </div>
    <div id="popup-container" class="hidden"></div>
    <script>
        fetch('../Popups/Info_Citizens.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('popup-container').innerHTML = data;
                document.getElementById('popup-container').classList.remove("hidden")

            });
    </script>
    <script src="../JS/Popup_Citizens.js"></script>
    <script type="module" src="../JS/Citizens.js"></script>
</body>

</html>
