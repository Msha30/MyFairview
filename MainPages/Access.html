<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyFairview</title>
    <link rel="stylesheet" href="../CSS/Components.css">
    <link rel="stylesheet" href="../CSS/Access.css">
    <script type="module" src="../JS/subpage_guard.js"></script>
    <script type="module" src="../JS/access.js"></script>
</head>

<body>
    <div class="grid-access">
        <div class="cardtable">
            <!-- ════════════════════════════════════════════════ -->
            <!-- ════════════════════ HEADER ════════════════════ -->
            <!-- ════════════════════════════════════════════════ -->
            <div class="header">
                <div class="title">
                    <div class="tabletitle">Barangay Staff Access</div>
                    <div class="tablesubtitle">Manage roles and permissions</div>
                </div>
                <a class="btn add" href="#">Add Member</a>
            </div>

            <!-- ════════════════════════════════════════════════ -->
            <!-- ═══════════════════ SEARCH ROW ═════════════════ -->
            <!-- ════════════════════════════════════════════════ -->
            <div class="search-row">
                <div class="inline-search">
                    <img src="../Icons/ic_search.svg">
                    <input id="search" type="text" placeholder="Search...">
                </div>
            </div>

            <!-- ════════════════════════════════════════════════ -->
            <!-- ════════════════════ TABLE ═════════════════════ -->
            <!-- ════════════════════════════════════════════════ -->
            <div class="table-scroll-wrapper">
                <table class="tableDiv members">
                    <thead>
                        <tr>
                            <th>MEMBER</th>
                            <th>ID NUMBER</th>
                            <th>ACCESS LEVEL</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Populated live from Firestore by access.js -->
                    </tbody>
                </table>
            </div>
        </div>
        <div class="logs">
            <!-- ════════════════════════════════════════════════ -->
            <!-- ═════════════════════ LOGS ═════════════════════ -->
            <!-- ════════════════════════════════════════════════ -->
            <div class="tabletitle">System Logs</div>
            <div class="tablesubtitle">Manage roles and permissions</div>
            <div class="card-scroll">
                <div class="list" id="systemLogsList">
                    <!-- Populated live from Firestore by access.js -->
                </div>
            </div>

        </div>
    </div>

    <div id="popup-container" class="hidden"></div>
</body>

</html>
