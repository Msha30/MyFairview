<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyFairview</title>
    <link rel="stylesheet" href="../CSS/Components.css">
    <link rel="stylesheet" href="../CSS/Reports.css">
    <script type="module" src="../JS/subpage_guard.js"></script>
    <script type="module" src="../JS/Reports.js"></script>
</head>

<body>
    <div class="grid-report">
        <div class="cardtable">
            <!-- ════════════════════════════════════════════════ -->
            <!-- ════════════════════ HEADER ════════════════════ -->
            <!-- ════════════════════════════════════════════════ -->
            <div class="header">
                <div class="title">
                    <div class="tabletitle">Incident Reports</div>
                    <div class="tablesubtitle">Reports submitted by the community</div>
                </div>
                <a class="btn export" href="#">Export CSV</a>
            </div>

            <!-- ════════════════════════════════════════════════ -->
            <!-- ═══════════════════ SEARCH ROW ═════════════════ -->
            <!-- ════════════════════════════════════════════════ -->
            <div class="search-row">
                <div class="inline-search">
                    <img src="../Icons/ic_search.svg">
                    <input id="search" type="text" placeholder="Search...">
                </div>
                <div id="report_sort" class="form-selectbg">
                    <select class="form-select" style="width:150px;">
                        <option>All Reports</option>
                        <option>Emergency</option>
                        <option>Community</option>
                        <option>Public Safety</option>
                        <option>Feedback</option>
                    </select>
                </div>
                <div id="status_sort" class="form-selectbg">
                    <select class="form-select" style="width:100px;">
                        <option>All</option>
                        <option>Unresolved</option>
                        <option>Resolved</option>
                        <option>Feedback</option>
                        <option>Invalid</option>
                    </select>
                </div>
            </div>

            <!-- ════════════════════════════════════════════════ -->
            <!-- ════════════════════ TABLE ═════════════════════ -->
            <!-- ════════════════════════════════════════════════ -->
            <div class="table-scroll-wrapper">
                <table class="tableDiv reports">
                    <thead>
                        <tr>
                            <th>REPORT</th>
                            <th>DETAILS</th>
                            <th>REPORTED BY</th>
                            <th>CONTACT NUMBER</th>
                        </tr>
                    </thead>
                    <tbody>
                        
                    </tbody>
                </table>
            </div>
        </div>
        <div class="grid">
            <button class="btn map" type="button">Reports Map</button>
            <div class="grid-btn">
                <!-- ════════════════════════════════════════════════ -->
                <!-- ════════════════════ STATS ═════════════════════ -->
                <!-- ════════════════════════════════════════════════ -->
                <button id="unresolved_btn" class="btn active" type="button">Unresolved</button>
                <button id="resolved_btn" class="btn inactive" type="button">Resolved</button>
                <!-- Change resolution summary based on selected button -->
            </div>
            <div id="resolution_summary" class="grid-summary">
                <div class="info">
                    <div class="stat-top">
                        <div class="stat-icon a">
                            <img src="../Icons/nav_reports.svg" class="iconpic a" alt="" />
                        </div>
                        <span class="stat-trend aa">0 This Month</span>
                    </div>
                    <div class="stat-val">0,000</div>
                    <div class="stat-label">Emergency Reports</div>
                </div>
                <div class="info">
                    <div class="stat-top">
                        <div class="stat-icon b">
                            <img src="../Icons/nav_reports.svg" class="iconpic b" alt="" />
                        </div>
                        <span class="stat-trend bb">0 This Month</span>
                    </div>
                    <div class="stat-val">0,000</div>
                    <div class="stat-label">Public Safety Reports</div>
                </div>
                <div class="info">
                    <div class="stat-top">
                        <div class="stat-icon c">
                            <img src="../Icons/nav_reports.svg" class="iconpic c" alt="" />
                        </div>
                        <span class="stat-trend cc">0 This Month</span>
                    </div>
                    <div class="stat-val">0,000</div>
                    <div class="stat-label">Community Reports</div>
                </div>
                <div class="info">
                    <div class="stat-top">
                        <div class="stat-icon d">
                            <img src="../Icons/nav_reports.svg" class="iconpic d" alt="" />
                        </div>
                        <span class="stat-trend dd">0 This Month</span>
                    </div>
                    <div class="stat-val">0,000</div>
                    <div class="stat-label">Feedback</div>
                </div>
            </div>
        </div>
    </div>
    <div id="modal-container"></div>

</body>

</html>
