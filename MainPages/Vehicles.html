<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyFairview Vehicles</title>
    <link rel="stylesheet" href="../CSS/Components.css">
    <link rel="stylesheet" href="../CSS/Vehicles.css">
    <script type="module" src="../JS/subpage_guard.js"></script>
    
    <script type="module" src="../JS/vehicle-manager.js"></script>
</head>

<body>
    <div class="grid-2">


        <!-- ════════════════════════════════════════════════ -->
        <!-- ═════════════════════ LIST ═════════════════════ -->
        <!-- ════════════════════════════════════════════════ -->
        <div class="card white">
            <div class="header">
                <div class="toptitle">
                    <div class="cardtitle">Barangay Vehicles</div>
                    <div class="cardsubtitle">Vehicles Available for the Community</div>
                </div>
                <a class="btn add" id="openAddVehicleBtn" href="#">Add Vehicle</a>
            </div>
            <div class="card-scroll">
                <div class="vehicle-list"></div>
            </div>
            <div class="buttons">
                <button class="button deploy" id="openDeployVehicleBtn">Deploy Vehicle</button>
            </div>
        </div>

        <!-- ═══════════════════════════════════════════════ -->
        <!-- ═════════════════════ MAP ═════════════════════ -->
        <!-- ═══════════════════════════════════════════════ -->
        <div class="card white">
            <div class="cardtitle">Fleet Geographic Overview</div>
            <div id="vehicleMapCard" style="width: 100%; height: 350px; border-radius: 8px; margin-top: 10px;"></div>
        </div>
    </div>
</body>
</html>
