<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyFairview</title>
    <link rel="stylesheet" href="../CSS/Components.css">
    <link rel="stylesheet" href="../CSS/Popups.css">
    <link rel="stylesheet" href="../CSS/Announcement.css">
    <script type="module" src="../JS/subpage_guard.js"></script>
</head>

<body>
    <div class="grid-2">
        <!-- ════════════════════════════════════════════════ -->
        <!-- ════════════════════ CREATE ════════════════════ -->
        <!-- ════════════════════════════════════════════════ -->
        <div class="card white">
            <div class="cardtitle">Create Announcement</div>
            <div class="cardsubtitle">Announcement Details</div>
            <div class="form-row title">
                <label class="form-label">Title</label>
                <input id="annTitleInput" class="form-input" type="text" placeholder="Announcement Title">
            </div>
            <div class="form-row">
                <label class="form-label">Category</label>
                <div class="form-selectbg">
                    <select id="annCategorySelect" class="form-select">
                        <option>General</option>
                        <option>Community Event</option>
                        <option>Health & Safety</option>
                        <option>Flood Advisory</option>
                        <option>Emergency</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <label class="form-label">Message</label>
                <textarea id="annMessageInput" class="form-input" placeholder="Enter the details here..."></textarea>
            </div>
            <!-- ═══════════════════════════════════════════════ -->
            <!-- ════════════════════ MEDIA ════════════════════ -->
            <!-- ═══════════════════════════════════════════════ -->
            <div class="grid-media">
                <div class="one">
                    <label class="form-label sub">Media</label>
                    <div class="form-hint">Cannot exceed 5 photos.</div>
                </div>
                <button id="addMediaBtn" class="media-add-btn" type="button">
                    <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <rect x="3" y="3" width="18" height="18" rx="2" />
                        <circle cx="8.5" cy="8.5" r="1.5" />
                        <polyline points="21 15 16 10 5 21" />
                    </svg>
                    Add photos
                    <span id="mediaCountNote" class="media-count-note">0 / 5</span>
                </button>
            </div>
            <div class="card-scroll">
                <div id="mediaListContainer" class="media-list">
                    <!-- Dynamically injected simulated media items will appear here -->
                </div>
            </div>
            <div class="form-footer">
                <button id="publishAnnBtn" class="btn-primary">
                    <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5"
                        viewBox="0 0 24 24">
                        <line x1="22" y1="2" x2="11" y2="13" />
                        <polygon points="22 2 15 22 11 13 2 9 22 2" />
                    </svg>
                    Publish
                </button>
            </div>
        </div>

        <!-- ═════════════════════════════════════════════════ -->
        <!-- ════════════════════ HISTORY ════════════════════ -->
        <!-- ═════════════════════════════════════════════════ -->
        <div class="card white">
            <div class="cardtitle">Published Announcements</div>
            <div id="pubCountSubtitle" class="cardsubtitle">Loading count...</div>
            <div class="card-scroll">
                <div id="announceListContainer" class="announce-list">
                    <!-- Dynamically populated announcements from Firestore -->
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal Container -->
    <div id="popup-container"></div>

    <script type="module" src="../JS/announcement.js"></script>
</body>

</html>
