<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-statale=1.0">
    <title>MyFairview</title>
    <link rel="stylesheet" href="../CSS/Components.css">
    <link rel="stylesheet" href="../CSS/EvacuationPlan.css">
    <script type="module" src="../JS/subpage_guard.js"></script>

    <script type="module" src="../JS/evac-manager.js"></script>
</head>

<body>
    <div class="grid-2">
        <!-- ════════════════════════════════════════════════ -->
        <!-- ═════════════════════ LIST ═════════════════════ -->
        <!-- ════════════════════════════════════════════════ -->
        <div class="card white">
            <div class="header">
                <div class="toptitle">
                    <div class="cardtitle">Evacuation Centers</div>
                    <div class="cardsubtitle">Evacuation Plan in Case of Emergency</div>
                </div>
                <a class="btn add" id="openAddEvacBtn" href="#">Add Location</a>
            </div>
            <div class="card-scroll">
                <div class="evac-list"></div>
            </div>
        </div>

        <!-- ═══════════════════════════════════════════════ -->
        <!-- ═════════════════════ MAP ═════════════════════ -->
        <!-- ═══════════════════════════════════════════════ -->
        <div class="card white">
            <div class="cardtitle">Evacuation Centers Map</div>
            <div id="evacMapCard" style="width: 100%; height: 400px; border-radius: 8px; margin-top: 10px;"></div>
        </div>
    </div>
</body>

</html>
