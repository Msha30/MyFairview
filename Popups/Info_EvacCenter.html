<link rel="stylesheet" href="../CSS/Components.css">
<link rel="stylesheet" href="../CSS/Popups.css">

<div id="infoEvacCenter" class="modal-overlay">
    <div class="content">
        <div class="grid-2">
            <div style="display: flex; flex-direction: column; gap: 15px;">
                <div class="infocard">
                    <div class="areaheader">
                        <div class="areatitle">Evacuation Center Information</div>
                    </div>
                    <table class="information">
                        <tr class="row">
                            <td>Place Name</td>
                            <td><input id="infoEvacName" class="input" type="text" value=""></td>
                        </tr>
                        <tr class="row wrap">
                            <td>Address</td>
                            <td><input id="infoEvacAddress" class="input" type="text" value=""></td>
                        </tr>
                        <tr class="row">
                            <td>Capacity</td>
                            <td><input id="infoEvacCapacity" class="input" type="text" value=""></td>
                        </tr>
                    </table>
                </div>
                <div class="infocard">
                    <table class="information">
                        <tr class="row">
                            <td>ID Number</td>
                            <td id="infoEvacIDNum">EC-000</td>
                        </tr>
                        <tr class="row">
                            <td>Added on</td>
                            <td id="infoEvacAddedOn">Month 00, 0000</td>
                        </tr>
                        <tr class="row">
                            <td>Added by</td>
                            <td id="infoEvacAddedBy">—</td>
                        </tr>
                    </table>
                    <button class="button delete">Remove Evacuation Center</button>
                </div>
                <button class="button accept">Apply Changes</button>
            </div>
            <div class="infocard loc">
                <div class="areaheader">
                    <div class="areatitle">Pin Location</div>
                </div>
                <div class="card">
                    <div id="infoEvacMapCard" style="width: 100%; height: 100%; border-radius: 8px;"></div>
                </div>
                <div class="address-hint">Click the map to move the pin — saved when you press Apply Changes.</div>
            </div>

        </div>
    </div>
</div>
<style>
    @import url("../Styles/Fonts.css");
    @import url("../Styles/Variables.css");
    @import url("../CSS/Popups.css");

    #infoEvacCenter .grid-2 {
        overflow: auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--cardgap);
        align-items: start;
    }

    #infoEvacCenter .infocard.loc {
        height: 100%;
    }

    #infoEvacCenter .card {
        width: 100%;
        height: 260px;
        padding: 0;
        overflow: hidden;
    }

    #infoEvacCenter .row td:first-child {
        width: 40%;
        text-align: left;
    }

    #infoEvacCenter .row td:last-child {
        text-align: left;
        padding-left: 30px;
    }

    #infoEvacCenter .address-hint {
        margin-top: 6px;
        font-size: var(--textsmall);
        color: #999;
    }
</style>
