<link rel="stylesheet" href="../CSS/Components.css">
<link rel="stylesheet" href="../CSS/Popups.css">

<div id="staffModal" class="modal-overlay">
    <div class="content">
        <div class="grid-2">
            <div style="display: flex; flex-direction: column; gap: 15px;">
                <div class="infocard">
                    <div class="areaheader">
                        <div class="areatitle">Personal Information</div>
                    </div>
                    <table class="information">
                        <tr class="row smol">
                            <td>Position</td>
                            <td><input id="edit-position" class="input" type="text" placeholder="Position"></td>
                        </tr>
                        <tr class="row smol">
                            <td>Surname</td>
                            <td><input id="edit-lName" class="input" type="text" placeholder="Surname"></td>
                        </tr>
                        <tr class="row smol">
                            <td>First Name</td>
                            <td><input id="edit-fName" class="input" type="text" placeholder="First Name"></td>
                        </tr>
                        <tr class="row smol">
                            <td>Middle Name</td>
                            <td><input id="edit-mName" class="input" type="text" placeholder="Middle Name"></td>
                        </tr>
                        <tr class="row smol">
                            <td>Suffix</td>
                            <td><input id="edit-suffix" class="input" type="text" placeholder="Suffix (e.g., Jr)"></td>
                        </tr>
                        <tr class="row smol">
                            <td>Contact Number</td>
                            <td><input id="edit-contact" class="input" type="text" placeholder="Contact"></td>
                        </tr>
                        <tr class="row smol">
                            <td>Date of Birth</td>
                            <td><input id="edit-dob" class="input" type="text" placeholder="YYYY-MM-DD"></td>
                        </tr>
                        <tr class="row smol">
                            <td>Email</td>
                            <!-- Email is kept disabled as changing it requires Firebase Auth verification updates -->
                            <td><input id="edit-email" class="input" type="text" disabled placeholder="Email"></td>
                        </tr>
                        <tr class="row wrap smol">
                            <td>Address</td>
                            <td><input id="edit-address" class="input" type="text" placeholder="Full Address"></td>
                        </tr>
                    </table>
                </div>
                <div class="infocard">
                    <table class="information">
                        <tr class="row smol">
                            <td>ID Number</td>
                            <td id="display-staffID">Loading...</td>
                        </tr>
                    </table>
                    <div class="buttons col">
                        <button class="button delete">Remove Staff</button>
                        <button class="button accept">Apply Changes</button>
                    </div>
                </div>
            </div>


            <div class="infocard access">
                <div class="areaheader">
                    <div class="areatitle">System Access</div>
                </div>

                <div class="access-list">

                        <div class="access-row">
                            <div class="access-name">Overview</div>
                            <div class="access-permissions">
                                <label><input type="checkbox" checked disabled> View</label>
                            </div>
                        </div>

                    <div class="access-row">
                        <div class="access-name">Announcement</div>
                        <div class="access-permissions">
                            <label><input id="edit-access-announcement-view" type="checkbox"> View</label>
                            <label><input id="edit-access-announcement-create" type="checkbox"> Create Announcement</label>
                            <label><input id="edit-access-announcement-edit" type="checkbox"> Edit Announcement</label>
                            <label><input id="edit-access-announcement-remove" type="checkbox"> Remove Announcement</label>
                        </div>
                    </div>

                    <div class="access-row">
                        <div class="access-name">Citizens</div>
                        <div class="access-permissions">
                            <label><input id="edit-access-citizens-view" type="checkbox"> View</label>
                            <label><input id="edit-access-citizens-verify" type="checkbox"> Verify Users</label>
                            <label><input id="edit-access-citizens-edit" type="checkbox"> Edit User Information</label>
                            <label><input id="edit-access-citizens-remove" type="checkbox"> Remove User</label>
                            <label><input id="edit-access-citizens-export" type="checkbox"> Export</label>
                        </div>
                    </div>

                    <div class="access-row">
                        <div class="access-name">Barangay Vehicles</div>
                        <div class="access-permissions">
                            <label><input id="edit-access-vehicles-view" type="checkbox"> View</label>
                            <label><input id="edit-access-vehicles-add" type="checkbox"> Add Vehicles</label>
                            <label><input id="edit-access-vehicles-deploy" type="checkbox"> Deploy Vehicles</label>
                            <label><input id="edit-access-vehicles-remove" type="checkbox"> Remove Vehicles</label>
                        </div>
                    </div>

                    <div class="access-row">
                        <div class="access-name">Community Reports</div>
                        <div class="access-permissions">
                            <label><input id="edit-access-reports-view" type="checkbox"> View</label>
                            <label><input id="edit-access-reports-resolve" type="checkbox"> Resolving Reports</label>
                        </div>
                    </div>

                    <div class="access-row">
                        <div class="access-name">Water Level</div>
                        <div class="access-permissions">
                            <label><input id="edit-access-water-view" type="checkbox"> View</label>
                            <label><input id="edit-access-water-edit" type="checkbox"> Edit Water Level Threshold</label>
                        </div>
                    </div>

                    <div class="access-row">
                        <div class="access-name">Evacuation Plan</div>
                        <div class="access-permissions">
                            <label><input id="edit-access-evacuation-view" type="checkbox"> View</label>
                            <label><input id="edit-access-evacuation-edit" type="checkbox"> Edit Evacuation Centers</label>
                            <label><input id="edit-access-evacuation-remove" type="checkbox"> Remove Evacuation Centers</label>
                        </div>
                    </div>

                    <div class="access-row">
                        <div class="access-name">Access Management</div>
                        <div class="access-permissions">
                            <label><input id="edit-access-management-view" type="checkbox"> View</label>
                            <label><input id="edit-access-management-add" type="checkbox"> Add Staff</label>
                            <label><input id="edit-access-management-edit" type="checkbox"> Edit Staff</label>
                            <label><input id="edit-access-management-remove" type="checkbox"> Remove Staff</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<style>
    @import url("../Styles/Fonts.css");
    @import url("../Styles/Variables.css");
    @import url("../CSS/Popups.css");

    /* Scoped strictly to #staffModal to avoid breaking global/background elements */
    #staffModal .information {
        width: 100%;
        border-collapse: collapse;
    }

    #staffModal .row {
        display: table-row; 
    }

    #staffModal .row td {
        display: table-cell; 
        vertical-align: middle;
        padding: 6px 0;
        border-bottom: 1px solid var(--border);
    }

    #staffModal .row td:first-child {
        width: 35%;
        font-family: 'InterBold', sans-serif;
        text-align: left;
    }

    #staffModal .row td:last-child {
        width: 65%;
        text-align: left;
        padding-left: 15px;
    }


    .content {
        max-width: 100%;
    }

    .grid-2 {
        overflow: auto;
        display: grid;
        grid-template-columns: 1fr 1.3fr;
        gap: var(--cardgap);
        align-items: stretch;
    }

    .areatitle {
        margin-right: 100px;
    }

    .row td:first-child {
        width: 40%;
        text-align: left;
    }

    .row td:last-child {
        text-align: left;
        padding-left: 30px;
    }

    .infocard.access {
        height: 100%;
    }

    .access-list {
        width: 100%;
        flex: 1;
        display: flex;
        flex-direction: column;
    }

    .access-row {
        flex: 1;
        padding: 10px 0px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-items: center;
        border-bottom: 1px solid #ddd;
    }

    .access-row:first-child {
        padding: 0px 0px 10px;
    }

    .access-row:last-child {
        border-bottom: none;
    }

    .access-name {
        font-family: 'InterSemiBold', sans-serif;
        font-size: var(--textreg);
        color: var(--grey);
    }

    .access-permissions {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    input[type="checkbox"] {
        accent-color: var(--green);
        transform: scale(1.2);
    }

    .access-permissions label {
        display: flex;
        align-items: center;
        font-family: 'Inter', sans-serif;
        font-size: var(--textsmall);
        gap: 6px;
        cursor: pointer;
    }

    .row.smol td {
        padding: 6px 0px;
    }

</style>
