
<link rel="stylesheet" href="../CSS/Popups.css">

<div id="addVehicleModal" class="modal-overlay" style="display: none;">
    <div class="contentadd">
        <div class="areaheader">
            <div class="areatitle">New Barangay Vehicle</div>
        </div>
        <div class="form-row add">
            <label class="form-label">Plate Number</label>
            <input id="addPlateNo" class="form-input" type="text" placeholder="e.g. PLT0000">
        </div>
        <div class="form-row add">
            <label class="form-label">Vehicle Model</label>
            <input id="addModel" class="form-input" type="text" placeholder="e.g. Ambulance">
        </div>
        <div class="form-row add">
            <label class="form-label">Color</label>
            <input id="addColor" class="form-input" type="text" placeholder="e.g. White">
        </div>
        <div class="form-row add">
            <label class="form-label">Capacity</label>
            <input id="addCapacity" class="form-input" type="number" placeholder="Enter Capacity...">
        </div>
        <div class="buttons">
            <button id="cancelAddVehicleBtn" class="button delete">Cancel</button>
            <button id="confirmAddVehicleBtn" class="button confirm">Add Vehicle</button>
        </div>
    </div>
</div>
<style>
    @import url("../Styles/Fonts.css");
    @import url("../Styles/Variables.css");
    @import url("../CSS/Popups.css");

    #addVehicleModal .contentadd {
        width: 400px;
    }
</style>
