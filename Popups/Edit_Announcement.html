<link rel="stylesheet" href="../CSS/Components.css">
<link rel="stylesheet" href="../CSS/Popups.css">

<div id="editAnnouncement" class="modal-overlay">
    <div class="contentadd">
        <div class="diatitle">Edit Announcement</div>
        <label class="form-label dia">Note: Only the title and message are editable.</label>
        <div class="form-row add">
            <label class="form-label">Title</label>
            <input id="editAnnTitle" class="form-input" type="text">
        </div>
        <div class="form-row add">
            <label class="form-label">Message</label>
            <textarea id="editAnnMessage" class="form-input big"></textarea>
        </div>
        <div class="buttons">
            <button id="cancelEditAnnBtn" class="button delete">Cancel</button>
            <button id="saveEditAnnBtn" class="button confirm">Save</button>
        </div>
    </div>
</div>
